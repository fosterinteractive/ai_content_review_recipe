langcode: en
status: true
# ReviewRule does not override calculateDependencies(), so Drupal recomputes
# this to empty on the first save through the UI. Shipping it empty keeps a
# re-export diff-free instead of showing a dependency that will not survive.
dependencies: {  }
id: fi_editorial_review
label: 'Editorial review'
record_type: internal
entity_type: node
bundles:
  - page
criteria:
  # ---------------------------------------------------------------------------
  # Every criterion below points at the same shared "content_review" agent. What
  # makes them different is prompt_template, which carries the whole compiled
  # prompt: the rubric, the aspects, the scoring scale and the calibration
  # examples. On 1.x the module prepends prompt_template to the record context
  # and sends that as the agent's task, so this is the only seam available for
  # per-criterion instructions.
  #
  # The "# Scoring scale" block in each prompt is written by hand to match that
  # criterion's pass_threshold / warn_threshold below. They are two separate
  # sources of truth: pass_threshold/warn_threshold decide the grade Drupal
  # shows, the scale text decides the number the AI aims for. CHANGE THEM
  # TOGETHER or the badge will disagree with the model's own idea of passing.
  # ---------------------------------------------------------------------------
  -
    label: 'Tone & voice'
    plugin_id: agent_based
    pass_threshold: 80
    warn_threshold: 60
    configuration:
      agent_id: content_review
      provider_config:
        use_default: true
        provider: ''
        model: ''
        config: {  }
      execution_mode: direct
      prompt_template: |-
        # Criterion: Tone & voice
        Judge whether the content sounds like our brand: warm, plain and approachable. We write in second person, in the active voice, in short sentences. We do not write like a contract, a policy manual or a warning label.

        # Aspects to consider (weigh these, then give ONE holistic score)
        - Warmth
        - Plain language

        # Scoring scale (0–100)
        - 0–59: Fail (clearly below the bar).
        - 60–79: Warning (borderline — still below Pass).
        - 80–100: Pass (meets the bar).
        PASS if score >= 80, otherwise FAIL.

        # Scored examples

        ## Example (aspect: Warmth)
        Text:
        '''
        We're here to help you get set up in minutes — just follow these three steps.
        '''
        Rationale: Second person, active voice, and a concrete promise. This is the target.
        Score: 92

        ## Example (aspect: Warmth)
        Text:
        '''
        Thank you for your registration. We will process your request shortly.
        '''
        Rationale: Polite and correct, but flat — it informs without sounding like anyone wrote it.
        Score: 68

        ## Example (aspect: Warmth)
        Text:
        '''
        Users must comply with the aforementioned procedural requirements henceforth.
        '''
        Rationale: The same instruction, drained of warmth — third person, legalistic, faintly threatening.
        Score: 30

        ## Example (aspect: Plain language)
        Text:
        '''
        Thanks for choosing us. Let's make this quick and painless.
        '''
        Rationale: Everyday words and short sentences. Reads like a person talking.
        Score: 84

        ## Example (aspect: Plain language)
        Text:
        '''
        To get started, please complete the setup process outlined below.
        '''
        Rationale: Readable, but 'complete the setup process' is three words doing one word's work.
        Score: 72

        ## Example (aspect: Plain language)
        Text:
        '''
        Failure to adhere to these instructions will result in termination of service.
        '''
        Rationale: Abstract nouns and a threat where a plain, friendly warning would do the same job.
        Score: 12
  -
    label: 'Inclusive language'
    plugin_id: agent_based
    pass_threshold: 85
    warn_threshold: 65
    configuration:
      agent_id: content_review
      provider_config:
        use_default: true
        provider: ''
        model: ''
        config: {  }
      execution_mode: direct
      prompt_template: |-
        # Criterion: Inclusive language
        Judge whether the content is inclusive and respectful: gender-neutral by default, free of assumptions about a reader's ability, age, family situation or background, and free of idioms that only land for one group. Flag exclusion even when it is clearly unintentional.

        # Aspects to consider (weigh these, then give ONE holistic score)
        - Gendered language
        - Assumptions about ability and access

        # Scoring scale (0–100)
        - 0–64: Fail (clearly below the bar).
        - 65–84: Warning (borderline — still below Pass).
        - 85–100: Pass (meets the bar).
        PASS if score >= 85, otherwise FAIL.

        # Scored examples

        ## Example (aspect: Gendered language)
        Text:
        '''
        Every team member can set the pronouns they use on their own profile.
        '''
        Rationale: Neutral by construction, and it treats the choice as the reader's to make.
        Score: 90

        ## Example (aspect: Gendered language)
        Text:
        '''
        Each team member should update their profile, and he or she can change it later.
        '''
        Rationale: Starts neutral, then falls back on 'he or she', which still leaves people out.
        Score: 78

        ## Example (aspect: Gendered language)
        Text:
        '''
        Each employee should update his profile with his preferred title.
        '''
        Rationale: The same sentence with a generic "he", which quietly excludes most of the audience.
        Score: 25

        ## Example (aspect: Assumptions about ability and access)
        Text:
        '''
        The session is captioned and the slides go out beforehand, so you can follow along in whatever way works for you.
        '''
        Rationale: Names the accommodation up front instead of leaving people to ask for it.
        Score: 88

        ## Example (aspect: Assumptions about ability and access)
        Text:
        '''
        The recording will be available afterwards if you missed the live session.
        '''
        Rationale: Offers an alternative, but assumes video works for everyone — no captions or transcript.
        Score: 74

        ## Example (aspect: Assumptions about ability and access)
        Text:
        '''
        Just glance at the chart — it obviously speaks for itself.
        '''
        Rationale: Assumes sight, and "obviously" tells anyone who does not follow that the problem is them.
        Score: 28
  -
    label: Readability
    plugin_id: agent_based
    pass_threshold: 75
    warn_threshold: 55
    configuration:
      agent_id: content_review
      provider_config:
        use_default: true
        provider: ''
        model: ''
        config: {  }
      execution_mode: direct
      prompt_template: |-
        # Criterion: Readability
        Judge how easily a general reader gets through this content: short sentences, common words, one idea per sentence, instructions that name the action first. Aim for roughly a grade 8 reading level. Judge the writing, not the subject — a technical topic can still be written plainly.

        # Aspects to consider (weigh these, then give ONE holistic score)
        - Sentence clarity
        - Word choice

        # Scoring scale (0–100)
        - 0–54: Fail (clearly below the bar).
        - 55–74: Warning (borderline — still below Pass).
        - 75–100: Pass (meets the bar).
        PASS if score >= 75, otherwise FAIL.

        # Scored examples

        ## Example (aspect: Sentence clarity)
        Text:
        '''
        Click Save. Your changes appear right away.
        '''
        Rationale: Two short sentences, action first, no clause to unpack.
        Score: 88

        ## Example (aspect: Sentence clarity)
        Text:
        '''
        After you have completed the setup, which usually takes a few minutes, you can begin adding content.
        '''
        Rationale: One nested clause between subject and action. Followable, but it makes you wait.
        Score: 66

        ## Example (aspect: Sentence clarity)
        Text:
        '''
        Subsequent to finalization of the aforementioned configuration, the system shall propagate the requisite modifications.
        '''
        Rationale: One sentence carrying three ideas, with the action buried at the end.
        Score: 34

        ## Example (aspect: Word choice)
        Text:
        '''
        To reset your password, open Settings and choose Reset.
        '''
        Rationale: Every word is one a reader already knows.
        Score: 80

        ## Example (aspect: Word choice)
        Text:
        '''
        Authenticate with your credentials to access the dashboard.
        '''
        Rationale: Understandable, but 'authenticate' and 'credentials' stand in for 'sign in' and 'password'.
        Score: 62

        ## Example (aspect: Word choice)
        Text:
        '''
        Utilization of this functionality necessitates prior authentication.
        '''
        Rationale: Three long abstractions standing in for "log in first".
        Score: 20
