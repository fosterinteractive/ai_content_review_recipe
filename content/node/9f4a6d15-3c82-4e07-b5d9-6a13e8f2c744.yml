  body:
    -
      value: '<h2>Before you start</h2><p>You will need access to the email address on your account. The whole thing takes about a minute.</p><h2>Step 1: Ask for a reset link</h2><p>On the sign-in page, choose <strong>Forgot password</strong>. Type your email address and select <strong>Send link</strong>. We will email you right away.</p><h2>Step 2: Pick a new password</h2><p>Open the email and select the link. Choose a new password with at least 12 characters. Select <strong>Save</strong>, and your new password works straight away.</p><h2>If the email does not arrive</h2><p>Check your spam folder first. Still nothing? Write to us at support@example.com and we will sort it out with you. If a screen reader is easier for you, the reset form works with one, and we can also reset the password for you over the phone.</p>'
      format: basic_html
