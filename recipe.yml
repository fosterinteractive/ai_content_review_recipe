name: 'AI Content Review Demo'
description: 'Demo setup for AI Content Review: a three-criterion editorial rule (tone & voice, inclusive language, readability) driven by one shared review agent, plus three sample pages.'
type: 'AI Initiative'

recipes:
  - core/recipes/page_content_type

install:
  # AI core. It arrives anyway as a dependency of ai_content_review, but the
  # config action below targets ai.settings, and recipe validation rejects a
  # config action whose extension is not installed by this recipe or one it
  # depends on — a transitive dependency does not count. Without this line the
  # recipe refuses to apply on a site where ai is not already enabled.
  - ai
  # The module under review, plus its dependency chain.
  - ai_content_review
  # Agent-based criteria need the agent system.
  - ai_agents
  # Both are required for the agent's [node:render:full] token.
  #
  # token_entity_render defines [node:render:VIEW_MODE]. On its own it is not
  # enough: its hook returns early unless $data['entity_type'] and
  # $data['entity'] are set, and the review flow passes only
  # ['node' => $entity]. The token module supplies the missing shape — when it
  # handles tokens for an entity token type it re-dispatches them as the
  # generic 'entity' type with entity/entity_type attached
  # (TokenTokensHooks, ~line 686).
  #
  # With token_entity_render but NOT token, the prompt keeps the literal string
  # [node:render:full], the model scores that, and every criterion returns
  # roughly 5 with severity critical — which reads like a real review of
  # terrible content, not like a bug. Neither module is a dependency of
  # ai_content_review, so both must be listed here.
  - token
  - token_entity_render

config:
  strict: false
  actions:
    ai.settings:
      verifySetupAi:
        operation_type_has_default_model:
          - chat_with_tools
