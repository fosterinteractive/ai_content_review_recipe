name: 'Foster Interactive AI Content Review'
description: 'Installs AI Content Review with a three-criterion editorial rule (tone & voice, inclusive language, readability) driven by one shared review agent.'
type: 'AI Initiative'

recipes:
  - core/recipes/page_content_type

install:
  # The module under review, plus its dependency chain.
  - ai_content_review
  # Agent-based criteria need the agent system.
  - ai_agents
  # Dev convenience: inspect the agent's turns at /admin/config/ai/agents-debug.
  # Safe to drop from this list for a production site.
  - ai_agents_debugger
  # Field tokens for the agent's system prompt. Core resolves [node:title] and
  # [node:body] on its own; this adds [node:field_*] so the agent can be pointed
  # at custom fields without further code.
  #
  # NOT token_entity_render: its [node:render:VIEW_MODE] token needs
  # $data['entity_type'] and $data['entity'], but ai_content_review 1.x passes
  # token contexts as [entity_type_id => $entity] only (see
  # InternalReviewRecordType::getTokenContexts() and
  # AiAgentEntityWrapper::applyTokens()). The token silently never resolves and
  # every criterion scores a blank page. Verified on 1.x @ 96680ef.
  - token

config:
  strict: false
  actions:
    ai.settings:
      verifySetupAi:
        operation_type_has_default_model:
          - chat_with_tools
